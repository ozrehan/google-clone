<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ============ HOME VIEW ============ -->
<div id="homeView">
  <header class="home-top">
    <nav>
      <a href="#" id="navHistory">History</a>
      <a href="#" id="navSaved">Saved</a>
      <button class="icon-btn" id="appsBtn" title="Google apps" aria-label="Google apps">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm12 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6 6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm12 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6 6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm12 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
      <button class="signin-btn" id="signinBtn">Sign in</button>
    </nav>
  </header>
  <div class="apps-menu" id="appsMenu" hidden>
    <a href="#" data-app="Search"><span class="app-dot" style="background:#4285F4">S</span>Search</a>
    <a href="#" data-app="History"><span class="app-dot" style="background:#EA4335">H</span>History</a>
    <a href="#" data-app="Saved"><span class="app-dot" style="background:#FBBC05">S</span>Saved</a>
    <a href="#" data-app="Lucky"><span class="app-dot" style="background:#34A853">L</span>Lucky</a>
  </div>

  <main class="home-main">
    <div class="logo" aria-label="Google">
      <span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span>
    </div>
    <form class="search-box" id="homeForm" autocomplete="off">
      <svg class="s-icon" viewBox="0 0 24 24" width="20" height="20"><path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input type="text" id="homeInput" aria-label="Search">
      <button type="button" class="clear-btn" id="homeClear" hidden aria-label="Clear">✕</button>
    </form>
    <div class="home-buttons">
      <button id="searchBtn">Google Search</button>
      <button id="luckyBtn">I'm Feeling Lucky</button>
    </div>
    <div class="home-lang">Google offered in: <a href="#">English</a></div>
  </main>

  <footer class="home-footer">
    <div class="f-row"><span>India</span></div>
    <div class="f-row links">
      <span><a href="#">About</a><a href="#">Advertising</a><a href="#">Business</a></span>
      <span><a href="#">Privacy</a><a href="#">Terms</a><a href="#" id="footSettings">Settings</a></span>
    </div>
  </footer>
</div>

<!-- ============ RESULTS VIEW ============ -->
<div id="resultsView" hidden>
  <header class="res-header">
    <a href="#" class="mini-logo" id="miniLogo" aria-label="Google home">
      <span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span>
    </a>
    <form class="search-box small" id="resForm" autocomplete="off">
      <input type="text" id="resInput" aria-label="Search">
      <button type="button" class="clear-btn" id="resClear" hidden aria-label="Clear">✕</button>
      <button type="submit" class="s-go" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#4285F4" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </button>
    </form>
    <div class="res-user">
      <button class="icon-btn" id="themeBtn2" title="Toggle dark mode">◐</button>
      <button class="signin-btn" id="signinBtn2">Sign in</button>
    </div>
  </header>
  <div class="res-stats" id="resStats"></div>
  <main class="res-main" id="resMain"></main>
  <div class="pagination" id="pagination"></div>
  <footer class="res-footer"><span>India</span></footer>
</div>

<!-- ============ LIST VIEW (history / saved) ============ -->
<div id="listView" hidden>
  <header class="res-header">
    <a href="#" class="mini-logo" id="miniLogo2" aria-label="Google home">
      <span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span>
    </a>
    <h2 id="listTitle"></h2>
    <div class="res-user"><button class="signin-btn" id="signinBtn3">Sign in</button></div>
  </header>
  <main class="res-main"><ul class="list-items" id="listItems"></ul></main>
</div>

<!-- ============ AUTH MODAL ============ -->
<div class="modal-backdrop" id="authModal" hidden>
  <div class="modal">
    <h2 id="authTitle">Sign in</h2>
    <div class="auth-tabs">
      <button id="tabSignin" class="active">Sign in</button>
      <button id="tabSignup">Create account</button>
    </div>
    <input type="text" id="authUser" placeholder="Username (3-20 lowercase letters/digits)" autocomplete="username">
    <input type="text" id="authName" placeholder="Display name" hidden autocomplete="name">
    <input type="password" id="authPass" placeholder="Password (min 6 characters)" autocomplete="current-password">
    <div class="auth-err" id="authErr"></div>
    <button class="signin-btn wide" id="authGo">Sign in</button>
    <button class="link-btn" id="authClose">Cancel</button>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
